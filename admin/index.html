<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Alex Rolon Ministry</title>
  <style>
    #pw-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: #1B4332;
      align-items: center; justify-content: center;
    }
    #pw-overlay.show { display: flex; }
    #pw-box {
      background: #fff; border-radius: 8px;
      padding: 2.5rem; max-width: 380px; width: 90%; text-align: center;
      font-family: system-ui, sans-serif;
    }
    #pw-box h2 { margin-bottom: .5rem; color: #1B4332; font-size: 1.4rem; }
    #pw-box p  { font-size: .85rem; color: #666; margin-bottom: 1.5rem; }
    #pw-input  { width: 100%; padding: .75rem 1rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; }
    #pw-btn    { width: 100%; padding: .85rem; background: #1B4332; color: #fff; border: none; border-radius: 6px; font-size: .95rem; font-weight: 600; cursor: pointer; }
    #pw-btn:hover { background: #2D6A4F; }
    #pw-msg    { margin-top: .85rem; font-size: .82rem; }
    #pw-msg.err { color: #c0392b; }
    #pw-msg.ok  { color: #27ae60; }
  </style>
</head>
<body>

  <div id="pw-overlay">
    <div id="pw-box">
      <h2 id="pw-title">Set Your Password</h2>
      <p id="pw-sub">Choose a password for your admin account.</p>
      <input id="pw-input" type="password" placeholder="New password (min 8 chars)" />
      <button id="pw-btn">Set Password & Log In</button>
      <div id="pw-msg"></div>
    </div>
  </div>

  <script>
    (function () {
      var hash   = window.location.hash.substring(1);
      var params = new URLSearchParams(hash);
      var invite = params.get('invite_token');
      var recovery = params.get('recovery_token');
      var token  = invite || recovery;
      var type   = invite ? 'signup' : 'recovery';

      if (!token) return;

      var overlay = document.getElementById('pw-overlay');
      overlay.classList.add('show');

      if (recovery) {
        document.getElementById('pw-title').textContent = 'Reset Your Password';
        document.getElementById('pw-sub').textContent   = 'Enter a new password for your account.';
      }

      document.getElementById('pw-btn').addEventListener('click', function () {
        var password = document.getElementById('pw-input').value;
        var msg = document.getElementById('pw-msg');
        var btn = document.getElementById('pw-btn');

        if (!password || password.length < 8) {
          msg.textContent = 'Password must be at least 8 characters.';
          msg.className = 'err';
          return;
        }

        btn.textContent = 'Setting password…';
        btn.disabled = true;
        msg.textContent = '';

        fetch('/.netlify/identity/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, type: type, password: password })
        })
        .then(function (res) { return res.json().then(function(d){ return {ok: res.ok, data: d}; }); })
        .then(function (r) {
          if (r.ok) {
            msg.textContent = 'Password set! Logging you in…';
            msg.className = 'ok';
            window.location.hash = '';
            setTimeout(function () { window.location.reload(); }, 1200);
          } else {
            msg.textContent = 'Error: ' + (r.data.msg || r.data.error || 'Something went wrong. Try a new invite.');
            msg.className = 'err';
            btn.textContent = 'Set Password & Log In';
            btn.disabled = false;
          }
        })
        .catch(function () {
          msg.textContent = 'Network error. Please try again.';
          msg.className = 'err';
          btn.textContent = 'Set Password & Log In';
          btn.disabled = false;
        });
      });

      document.getElementById('pw-input').addEventListener('keydown', function(e){
        if (e.key === 'Enter') document.getElementById('pw-btn').click();
      });
    })();
  </script>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
